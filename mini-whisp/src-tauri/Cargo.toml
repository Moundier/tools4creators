[package]
name = "mini-whisp"
version = "0.1.0"
description = "Live audio transcription with whisper.cpp"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "mini_whisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
