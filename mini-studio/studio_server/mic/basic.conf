# CASA NOVA Mic, preset "basic": PipeWire filter-chain voice processing (light on CPU).
# preset: basic
# Template filled in by mic_setup.py (@...@ placeholders), installed to
# ~/.config/pipewire/pipewire.conf.d/casanova-mic.conf
#
# mic -> RNNoise (AI noise suppression) -> high-pass 80 Hz -> -3 dB @ 300 Hz (mud)
#     -> +3 dB @ 3.5 kHz (presence) -> compressor 3:1 -> limiter -1 dB -> "CASA NOVA Mic"
#
#     (optional notch filters for hum / whine tones right after the high-pass)
#
# Mono in and out: PipeWire runs one copy of the graph per channel, so stereo would double the CPU.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "CASA NOVA Mic"
            media.name       = "CASA NOVA Mic"
            filter.graph = {
                nodes = [
                    { type = ladspa  name = denoise  plugin = "@RNNOISE@"  label = noise_suppressor_mono
                      control = { "VAD Threshold (%)" = @VAD@  "VAD Grace Period (ms)" = 200  "Retroactive VAD Grace (ms)" = 30 } }
                    { type = builtin  name = highpass  label = bq_highpass
                      control = { "Freq" = 80.0  "Q" = 0.707 } }
@NOTCH_NODES@
                    { type = builtin  name = mud  label = bq_peaking
                      control = { "Freq" = 300.0  "Q" = 1.0  "Gain" = -3.0 } }
                    { type = builtin  name = presence  label = bq_peaking
                      control = { "Freq" = 3500.0  "Q" = 0.9  "Gain" = 3.0 } }
                    { type = ladspa  name = comp  plugin = "@SC4M@"  label = sc4m
                      control = { "RMS/peak" = 0.3  "Attack time (ms)" = 8  "Release time (ms)" = 120
                                  "Threshold level (dB)" = -20  "Ratio (1:n)" = 3  "Knee radius (dB)" = 4
                                  "Makeup gain (dB)" = @MAKEUP@ } }
                    { type = ladspa  name = limit  plugin = "@LIMITER@"  label = fastLookaheadLimiter
                      control = { "Input gain (dB)" = 0  "Limit (dB)" = -1  "Release time (s)" = 0.08 } }
                ]
                links = [
                    { output = "denoise:Output"  input = "highpass:In" }
@NOTCH_LINKS@
                    { output = "mud:Out"         input = "presence:In" }
                    { output = "presence:Out"    input = "comp:Input" }
                    { output = "comp:Output"     input = "limit:Input 1" }
                ]
                inputs  = [ "denoise:Input" ]
                outputs = [ "limit:Output 1" ]
            }
            capture.props = {
                node.name    = "casanova_mic.capture"
                audio.channels = 1
                audio.position = [ MONO ]
                node.passive = true
                @TARGET@
            }
            playback.props = {
                node.name   = "casanova_mic"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
