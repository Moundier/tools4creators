# CASA NOVA Mic, preset "studio": broadcast-style voice chain for PipeWire's filter-chain.
# preset: studio
# Template filled in by `studio.py mic install` (@...@ placeholders), installed to
# ~/.config/pipewire/pipewire.conf.d/casanova-mic.conf
#
# mic -> DeepFilterNet (AI noise + room-echo removal) -> gate (lowers the hiss DeepFilterNet leaves between words)
#     -> high-pass 100 Hz (24 dB/oct) -> notch filters (hum / whine tones, optional)
#     -> EQ: -4 dB @ 180 Hz (boom), -3 dB @ 320 Hz (boxiness), +3 dB @ 2 kHz (clarity), +2.5 dB @ 4.5 kHz (presence),
#        +3 dB shelf above 10 kHz (air) -> low-pass 18 kHz (hiss above the voice)
#     -> input gain -> leveler 2.5:1 (slow, RMS) -> peak compressor 4:1 (fast) -> limiter -1 dB -> "CASA NOVA Mic"
#
# The gain sits after the gate and before the compressors: the hiss is lowered before it gets amplified,
# and the compressors always get the voice at the level they are tuned for.
# Mono in and out: PipeWire runs one copy of the graph per channel, and DeepFilterNet is too heavy to run twice
# (two copies made it fall behind: "Underrun detected" in the journal = clicks).
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "CASA NOVA Mic"
            media.name       = "CASA NOVA Mic"
            filter.graph = {
                nodes = [
                    { type = ladspa  name = denoise  plugin = "@DEEPFILTER@"  label = deep_filter_mono
                      control = { "Attenuation Limit (dB)" = @DENOISE@  "Min processing threshold (dB)" = -15
                                  "Max ERB processing threshold (dB)" = 35  "Max DF processing threshold (dB)" = 35
                                  "Min Processing Buffer (frames)" = 0  "Post Filter Beta" = 0.02 } }
                    { type = ladspa  name = gate  plugin = "@GATE_PLUGIN@"  label = gate
                      control = { "LF key filter (Hz)" = 80  "HF key filter (Hz)" = 6000  "Threshold (dB)" = @GATE@
                                  "Attack (ms)" = 2  "Hold (ms)" = 150  "Decay (ms)" = 200  "Range (dB)" = -25
                                  "Output select (-1 = key listen, 0 = gate, 1 = bypass)" = 0 } }
                    { type = builtin  name = hp1  label = bq_highpass  control = { "Freq" = 100.0  "Q" = 0.707 } }
                    { type = builtin  name = hp2  label = bq_highpass  control = { "Freq" = 100.0  "Q" = 0.707 } }
@NOTCH_NODES@
                    { type = builtin  name = boom  label = bq_peaking  control = { "Freq" = 180.0  "Q" = 0.8  "Gain" = -4.0 } }
                    { type = builtin  name = mud  label = bq_peaking  control = { "Freq" = 320.0  "Q" = 1.0  "Gain" = -3.0 } }
                    { type = builtin  name = clarity  label = bq_peaking  control = { "Freq" = 2000.0  "Q" = 1.0  "Gain" = 3.0 } }
                    { type = builtin  name = presence  label = bq_peaking  control = { "Freq" = 4500.0  "Q" = 1.0  "Gain" = 2.5 } }
                    { type = builtin  name = air  label = bq_highshelf  control = { "Freq" = 10000.0  "Q" = 0.707  "Gain" = 3.0 } }
                    { type = builtin  name = lowpass  label = bq_lowpass  control = { "Freq" = 18000.0  "Q" = 0.707 } }
                    { type = ladspa  name = gain  plugin = "@AMP@"  label = amp  control = { "Amps gain (dB)" = @MAKEUP@ } }
                    { type = ladspa  name = leveler  plugin = "@SC4M@"  label = sc4m
                      control = { "RMS/peak" = 1.0  "Attack time (ms)" = 20  "Release time (ms)" = 250
                                  "Threshold level (dB)" = -24  "Ratio (1:n)" = 2.5  "Knee radius (dB)" = 6  "Makeup gain (dB)" = 0 } }
                    { type = ladspa  name = peakcomp  plugin = "@SC4M@"  label = sc4m
                      control = { "RMS/peak" = 0.0  "Attack time (ms)" = 3  "Release time (ms)" = 80
                                  "Threshold level (dB)" = -14  "Ratio (1:n)" = 4  "Knee radius (dB)" = 3  "Makeup gain (dB)" = 4 } }
                    { type = ladspa  name = limit  plugin = "@LIMITER@"  label = fastLookaheadLimiter
                      control = { "Input gain (dB)" = 0  "Limit (dB)" = -1  "Release time (s)" = 0.05 } }
                ]
                links = [
                    { output = "denoise:Audio Out"  input = "gate:Input" }
                    { output = "gate:Output"        input = "hp1:In" }
                    { output = "hp1:Out"            input = "hp2:In" }
@NOTCH_LINKS@
                    { output = "boom:Out"           input = "mud:In" }
                    { output = "mud:Out"            input = "clarity:In" }
                    { output = "clarity:Out"        input = "presence:In" }
                    { output = "presence:Out"       input = "air:In" }
                    { output = "air:Out"            input = "lowpass:In" }
                    { output = "lowpass:Out"        input = "gain:Input" }
                    { output = "gain:Output"        input = "leveler:Input" }
                    { output = "leveler:Output"     input = "peakcomp:Input" }
                    { output = "peakcomp:Output"    input = "limit:Input 1" }
                ]
                inputs  = [ "denoise:Audio In" ]
                outputs = [ "limit:Output 1" ]
            }
            audio.rate     = 48000
            capture.props = {
                node.name    = "casanova_mic.capture"
                audio.channels = 1
                audio.position = [ MONO ]
                node.passive = true
                node.latency = 1024/48000
                @TARGET@
            }
            playback.props = {
                node.name   = "casanova_mic"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
